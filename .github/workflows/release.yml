name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@e05e126f29f36bf68b8bfeffdc12278326160d98 # v0.26.0
    with:
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      install: ${{ steps.install.outputs.install }}
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false

      - name: Build the distribution
        run: uv build

      - name: Refuse unless the build holds exactly the client wheel at the version
        run: |
          expected="overnightworks_agents-${VERSION}-py3-none-any.whl"
          built="$(cd dist && ls -- *.whl | sort)"
          if [ "$built" != "$expected" ]; then
            echo "Refused: the build must hold exactly this wheel:" >&2
            echo "$expected" >&2
            echo "but it holds:" >&2
            echo "$built" >&2
            exit 1
          fi

      - name: Refuse unless the wheel carries the committed agents vocabulary
        run: |
          wheel="dist/overnightworks_agents-${VERSION}-py3-none-any.whl"
          if ! unzip -p "$wheel" agents/agents-vocabulary.json | cmp - src/agents/agents-vocabulary.json; then
            echo "Refused: the wheel's agents/agents-vocabulary.json must be byte-identical to" >&2
            echo "src/agents/agents-vocabulary.json, which scripts/generate_agents_vocabulary.py writes." >&2
            exit 1
          fi

      - name: Write the release note naming the git tag
        id: install
        run: |
          previous_tag=$({ git tag --list 'v*'; echo "v${VERSION}"; } | sort -V -u \
            | awk -v me="v${VERSION}" '$0 == me { print previous; exit } { previous = $0 }')
          previous_snapshot=
          if [ -n "$previous_tag" ]; then
            previous_snapshot=$(git show "${previous_tag}:scripts/member-tool-wire.json" 2> /dev/null || true)
          fi
          wire_line=$(printf '%s' "$previous_snapshot" | python3 scripts/member_tool_wire_diff.py)
          {
            echo 'install<<INSTALL_LINES'
            echo '**Install.** Pin the git tag.'
            echo
            echo '```'
            echo "overnightworks-agents @ git+https://github.com/${GITHUB_REPOSITORY}@v${VERSION}"
            echo '```'
            echo
            echo "$wire_line"
            echo 'INSTALL_LINES'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  tag:
    name: Tag
    needs: [gate, build]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@e05e126f29f36bf68b8bfeffdc12278326160d98 # v0.26.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      artifact: wheels
      notes: ${{ needs.build.outputs.install }}
