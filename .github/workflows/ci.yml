name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Host vocabulary stays out of the tree
        env:
          HOST_VOCABULARY: 'co-?writer|cowriter|song|lyric|cover[ _-]?image|album|musician|judge([^a-z]|$)|\b(hopin|skat|personas|presentator|gitmirror|songmaker|hal|webauth)\b|\b(bpm|key_scale|audio_duration|tempo|set_tempo|verse|chorus|rhyme|vers)\b'
        run: |
          hits=$(git grep -n -i -E "$HOST_VOCABULARY" -- src tests docs) || [ $? -eq 1 ]
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            exit 1
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: The figure vocabulary is what its pinned release says
        run: |
          uv run --locked --no-sync python scripts/generate_figure_vocabulary.py
          git diff --exit-code -- src/agents/figure_vocabulary.py scripts/figure_vocabulary_pin.toml

      - name: The agents vocabulary is what StopOutcome says
        run: |
          uv run --locked --no-sync python scripts/generate_agents_vocabulary.py
          git diff --exit-code -- src/agents/agents-vocabulary.json

      - name: The member-tool wire is what the person front declares
        run: |
          uv run --locked --no-sync python scripts/generate_member_tool_wire.py
          git diff --exit-code -- scripts/member-tool-wire.json

      - name: Every forbidden import names a real package
        run: uv run --locked --no-sync python scripts/check_forbidden_imports_exist.py

      - name: Ruff
        run: uv run --locked --no-sync ruff check src tests scripts

      - name: Pyright
        run: uv run --locked --no-sync pyright

      - name: Tests
        run: uv run --locked --no-sync pytest -n auto --cov=src --cov=scripts --cov-report=xml:coverage.xml

      - name: Two pods on a real Redis
        run: scripts/run_redis_tests.sh

      - name: Upload the coverage report for the quality gate
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      - name: Build the distribution
        run: uv build

      - name: The client wheel carries the repository licence
        run: |
          licence="$(mktemp -d "$RUNNER_TEMP/client-licence.XXXXXX")"
          python3 -I -m zipfile -e dist/overnightworks_agents-*-py3-none-any.whl "$licence"
          cmp LICENSE "$licence"/overnightworks_agents-*.dist-info/licenses/LICENSE

      - name: The git sources a host supplies
        run: |
          python3 -I -c '
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              sources = tomllib.load(pyproject)["tool"]["uv"]["sources"]
          for name in ("logline", "tandem"):
              source = sources["overnightworks-" + name]
              print(name.upper() + "_SOURCE=overnightworks-" + name + " @ git+" + source["git"] + "@" + source["tag"])
          ' >> "$GITHUB_ENV"

      - name: The client wheel imports alone, without its extras
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-only.XXXXXX")"
          uv venv "$proof/venv"
          uv pip install --python "$proof/venv/bin/python" \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agents-*-py3-none-any.whl
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import importlib
          import importlib.util
          import pkgutil

          import agents

          assert importlib.util.find_spec("anyio") is None, "the mcp-server extra leaked in"
          for module in pkgutil.walk_packages(agents.__path__, "agents."):
              if module.name == "agents.mcp_server" or module.name.startswith(
                  "agents.mcp_server."
              ) or module.name == "agents.voice" or module.name.startswith(
                  "agents.voice."
              ) or module.name in (
                  "agents.backend.gateway",
                  "agents.backend.fake_gateway",
                  "agents.backend.tool_result",
              ):
                  continue
              importlib.import_module(module.name)
              print("imported", module.name)
          '

      - name: The client wheel with the mcp-server extra imports its server half
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-mcp-server.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agents-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[mcp-server]" "$LOGLINE_SOURCE"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agents.mcp_server

          print("imported", agents.mcp_server.__name__)
          '

      - name: The client wheel with the redis extra imports its place store
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-redis.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agents-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[redis]" "$LOGLINE_SOURCE" "$TANDEM_SOURCE"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agents.mcp_server.redis_place_store

          print("imported", agents.mcp_server.redis_place_store.__name__)
          '

      - name: The client wheel with the backend extra imports the gateway backend
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-backend.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agents-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[backend]" "$LOGLINE_SOURCE"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agents.backend.fake_gateway
          import agents.backend.gateway

          print("imported", agents.backend.gateway.__name__)
          '

      - name: The client wheel with the voice extra imports its voice half
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-voice.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agents-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[voice]" "$LOGLINE_SOURCE"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import importlib
          import pkgutil

          import agents.voice

          for module in pkgutil.walk_packages(
              agents.voice.__path__, "agents.voice."
          ):
              importlib.import_module(module.name)
              print("imported", module.name)
          '

  checks:
    name: checks
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Python minor passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  dependency-floors:
    name: dependency-floors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install the lowest declared direct dependencies
        run: |
          uv lock
          uv sync --frozen --extra dev

      - name: Versions the suite runs against
        run: uv pip list

      - name: Tests
        run: uv run --no-sync pytest -n auto

  quality:
    needs: [checks, dependency-floors]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@0cff5e74b3a9b106490723264468271a23d5579d # v0.24.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
