[project]
name = "overnightworks-agents"
version = "0.48.0"
description = "Light client for apps that run agents: the agent file, the tool contract an app declares and the gateway backend"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.optional-dependencies]
backend = [
    "httpx2>=2.12,<3",
]
mcp-server = [
    "anyio>=4.12,<5",
    "mcp>=2.3,<3",
]
redis = [
    "overnightworks-agents[mcp-server]",
    "overnightworks-tandem @ git+https://github.com/overnightworks/tandem@v0.5.1",
]
voice = [
    "syntok>=1.4.4,<2",
]
dev = [
    "overnightworks-agents[backend,mcp-server,redis,voice]",
    "fakeredis[lua]>=2.35,<3",
    "redis>=8.1,<9",
    "pyright==1.1.414",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17,<1",
    "cryptography>=50.0.2",
    "fastapi>=0.133,<1",
    "uvicorn>=0.54,<1",
]

[project.urls]
Repository = "https://github.com/overnightworks/agents"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["py.typed", "agents-vocabulary.json"]

[tool.ruff]
target-version = "py314"
src = ["src", "."]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "real_redis"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
